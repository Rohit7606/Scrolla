<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14100E; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(110% 52% at 50% 66%, rgba(237, 106, 90, 0.20) 0%, rgba(237, 106, 90, 0.07) 38%, rgba(237, 106, 90, 0) 74%); pointer-events: none;"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(10, 8, 7, 0.82) 0%, rgba(10, 8, 7, 0.34) 28%, rgba(10, 8, 7, 0) 54%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; gap: 4px; padding: 26px 24px 0 24px;">
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 18px; padding: 32px 24px 0 24px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 84px; line-height: 0.86; color: #ED6A5A; font-feature-settings: 'tnum';">2.8</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; color: #A8918A;">km</span>
    </div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 22px; line-height: 1.3; color: #A8918A;">You said about a metre.</div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 18px; padding: 40px 24px 0 24px;">
    <div style="font-size: 10.5px; font-weight: 500; letter-spacing: 0.18em; color: #8B837D;">THE SAME WALK, ON FOOT</div>

    <svg width="342" height="238" viewBox="0 0 342 238" fill="none" style="display: block;">
      <path d="M18 20 H288 a30 30 0 0 1 0 60 H54 a30 30 0 0 0 0 60 H288 a30 30 0 0 1 0 60 H18"
            stroke="#ED6A5A" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.75"></path>
      <circle cx="18" cy="20" r="5" fill="#ED6A5A"></circle>
      <circle cx="18" cy="200" r="5" fill="none" stroke="#7A6F69" stroke-width="1.5"></circle>
      <text x="32" y="14" fill="#8B837D" font-family="Space Grotesk, sans-serif" font-size="11" letter-spacing="1.8">START</text>
      <text x="32" y="226" fill="#F5F1EE" font-family="Instrument Serif, Georgia, serif" font-size="22">35 minutes later</text>
    </svg>
  </div>

  <div style="position: relative; padding: 26px 24px 0 24px;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 21px; line-height: 1.3; color: #B79E96; text-wrap: pretty;">Your thumb walked it instead.</div>
  </div>

  <div style="position: relative; margin-top: auto; padding: 0 24px 34px 24px;">
    <div style="background: #ED6A5A; color: #2A0F09; border-radius: 999px; padding: 17px; text-align: center; font-size: 15.5px; font-weight: 500;">Continue</div>
  </div>

</div>
</x-dc>
</body>
</html>
