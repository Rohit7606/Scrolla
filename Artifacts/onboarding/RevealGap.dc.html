<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14100E; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(110% 52% at 40% 64%, rgba(237, 106, 90, 0.22) 0%, rgba(237, 106, 90, 0.08) 38%, rgba(237, 106, 90, 0) 74%); pointer-events: none;"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(10, 8, 7, 0.82) 0%, rgba(10, 8, 7, 0.34) 28%, rgba(10, 8, 7, 0) 54%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; gap: 4px; padding: 26px 24px 0 24px;">
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 18px; padding: 32px 24px 0 24px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 84px; line-height: 0.86; color: #ED6A5A; font-feature-settings: 'tnum';">2.8</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; color: #A8918A;">km</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 17px; color: #A8918A;">A 35-minute walk.</div>
      <div style="font-size: 17px; font-weight: 500; color: #F5F1EE;">With your thumb.</div>
    </div>
  </div>

  <div style="position: relative; display: flex; padding: 44px 24px 0 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; width: 40px; flex-shrink: 0;">
      <div style="width: 9px; height: 9px; border-radius: 999px; background: #ED6A5A;"></div>
      <div style="width: 1px; flex-grow: 1; background: linear-gradient(180deg, #ED6A5A 0%, #5C4B45 55%, #5C4B45 100%);"></div>
      <div style="width: 9px; height: 9px; border-radius: 999px; border: 1px solid #7A6F69;"></div>
    </div>

    <div style="display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; height: 300px; padding-left: 4px;">
      <div style="display: flex; flex-direction: column; gap: 3px; margin-top: -8px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1.1; color: #ED6A5A;">2.8 km</div>
        <div style="font-size: 12.5px; color: #8B837D;">a typical day</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 0;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 52px; line-height: 1; color: #F5F1EE;">2,800×</div>
        <div style="font-size: 14px; color: #A8918A;">further than you guessed</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 3px; margin-bottom: -8px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; line-height: 1.1; color: #A8918A;">About a metre</div>
        <div style="font-size: 12.5px; color: #8B837D;">what you said</div>
      </div>
    </div>
  </div>

  <div style="position: relative; margin-top: auto; padding: 0 24px 34px 24px;">
    <div style="background: #ED6A5A; color: #2A0F09; border-radius: 999px; padding: 17px; text-align: center; font-size: 15.5px; font-weight: 500;">Continue</div>
  </div>

</div>
</x-dc>
</body>
</html>
