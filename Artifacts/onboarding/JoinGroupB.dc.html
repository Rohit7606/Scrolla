<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14100E; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(105% 46% at 50% 74%, rgba(237, 106, 90, 0.15) 0%, rgba(237, 106, 90, 0.05) 40%, rgba(237, 106, 90, 0) 76%); pointer-events: none;"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(10, 8, 7, 0.82) 0%, rgba(10, 8, 7, 0.34) 28%, rgba(10, 8, 7, 0) 54%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; gap: 4px; padding: 26px 24px 0 24px;">
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 30px 24px 0 24px;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1.1; color: #F5F1EE;">Join your friends</div>
    <div style="font-size: 14.5px; line-height: 1.5; color: #A8918A;">Enter the 6-character code someone shared with you.</div>
  </div>

  <div style="position: relative; display: flex; gap: 8px; padding: 30px 24px 0 24px;">
    <div style="flex-grow: 1; height: 56px; border-radius: 14px; border: 1px solid #6E4239; background: #221715; display: flex; align-items: center; justify-content: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #F5F1EE;">A</div>
    <div style="flex-grow: 1; height: 56px; border-radius: 14px; border: 1px solid #6E4239; background: #221715; display: flex; align-items: center; justify-content: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #F5F1EE;">3</div>
    <div style="flex-grow: 1; height: 56px; border-radius: 14px; border: 1px solid #ED6A5A; background: #221715; display: flex; align-items: center; justify-content: center;">
      <div style="width: 1px; height: 24px; background: #ED6A5A;"></div>
    </div>
    <div style="flex-grow: 1; height: 56px; border-radius: 14px; border: 1px solid #332A27;"></div>
    <div style="flex-grow: 1; height: 56px; border-radius: 14px; border: 1px solid #332A27;"></div>
    <div style="flex-grow: 1; height: 56px; border-radius: 14px; border: 1px solid #332A27;"></div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 16px; padding: 40px 24px 0 24px;">
    <div style="font-size: 10.5px; font-weight: 500; letter-spacing: 0.18em; color: #8B837D;">WHAT JOINING DOES</div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3FBE9C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;">
          <path d="M4 12.5l5 5L20 6.5"></path>
        </svg>
        <div style="font-size: 14px; line-height: 1.45; color: #D6CCC6;">They see your daily total, once a day.</div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E0A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;">
          <path d="M6 6l12 12"></path>
          <path d="M18 6L6 18"></path>
        </svg>
        <div style="font-size: 14px; line-height: 1.45; color: #D6CCC6;">They never see which apps, or when.</div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B837D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;">
          <path d="M4 12a8 8 0 1 0 3-6.2"></path>
          <path d="M4 4v4h4"></path>
        </svg>
        <div style="font-size: 14px; line-height: 1.45; color: #D6CCC6;">You can leave a group at any time.</div>
      </div>
    </div>
  </div>

  <div style="position: relative; margin-top: auto; display: flex; flex-direction: column; gap: 16px; padding: 0 24px 34px 24px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
      <div style="font-size: 13.5px; color: #A8918A; text-decoration: underline; text-underline-offset: 3px;">Create a group</div>
      <div style="width: 1px; height: 12px; background: #332A27;"></div>
      <div style="font-size: 13.5px; color: #8B837D;">Skip for now</div>
    </div>
    <div style="background: #3A2F2C; color: #8B837D; border-radius: 999px; padding: 17px; text-align: center; font-size: 15.5px; font-weight: 500;">Join group</div>
  </div>

</div>
</x-dc>
</body>
</html>
