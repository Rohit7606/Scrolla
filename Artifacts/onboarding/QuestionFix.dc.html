<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14100E; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(105% 48% at 26% 72%, rgba(237, 106, 90, 0.15) 0%, rgba(237, 106, 90, 0.05) 38%, rgba(237, 106, 90, 0) 74%); pointer-events: none;"></div>

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(10, 8, 7, 0.70) 0%, rgba(10, 8, 7, 0.20) 30%, rgba(10, 8, 7, 0) 52%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; gap: 4px; padding: 26px 24px 0 24px;">
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
  </div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px; padding: 0 24px;">

    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 44px; line-height: 1.1; color: #F5F1EE; text-wrap: pretty;">How far do you think you scroll each day?</div>

    <div style="display: flex; flex-direction: column; gap: 10px;">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid #2E2624; border-radius: 16px; padding: 18px 20px;">
        <span style="font-size: 16px; color: #F5F1EE;">A few centimetres</span>
        <div style="width: 18px; height: 18px; border-radius: 999px; border: 1px solid #4A4340;"></div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid #6E4239; border-radius: 16px; padding: 18px 20px; background: #241715;">
        <span style="font-size: 16px; font-weight: 500; color: #F5F1EE;">About a metre</span>
        <div style="width: 18px; height: 18px; border-radius: 999px; border: 5px solid #ED6A5A; box-sizing: border-box;"></div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid #2E2624; border-radius: 16px; padding: 18px 20px;">
        <span style="font-size: 16px; color: #F5F1EE;">Several kilometres</span>
        <div style="width: 18px; height: 18px; border-radius: 999px; border: 1px solid #4A4340;"></div>
      </div>

    </div>

  </div>

  <div style="position: relative; padding: 0 24px 34px 24px;">
    <div style="background: #ED6A5A; color: #2A0F09; border-radius: 999px; padding: 17px; text-align: center; font-size: 15.5px; font-weight: 500;">Continue</div>
  </div>

</div>
</x-dc>
</body>
</html>
