<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #17110F; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; gap: 4px; padding: 26px 24px 0 24px;">
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #2E2624;"></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 0 32px;">

    <div style="display: flex;">
      <div style="font-size: 12px; color: #8B837D; border: 1px solid #2E2624; border-radius: 999px; padding: 6px 12px;">You guessed: about a metre</div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 132px; line-height: 0.82; color: #ED6A5A; font-feature-settings: 'tnum';">2.8</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 36px; color: #A8918A;">km</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 26px; line-height: 1.25; color: #A8918A;">A 35-minute walk.</div>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.25; color: #F5F1EE;">With your thumb.</div>
    </div>

  </div>

  <div style="padding: 0 24px 34px 24px; display: flex; flex-direction: column; gap: 18px;">
    <div style="font-size: 12.5px; color: #6E6560; text-align: center;">Measured, not estimated.</div>
    <div style="background: #ED6A5A; color: #2A0F09; border-radius: 999px; padding: 17px; text-align: center; font-size: 15.5px; font-weight: 500;">Continue</div>
  </div>

</div>
</x-dc>
</body>
</html>
