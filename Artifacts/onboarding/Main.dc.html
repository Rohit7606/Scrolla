<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14100E; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(115% 55% at 46% 66%, rgba(237, 106, 90, 0.22) 0%, rgba(237, 106, 90, 0.08) 38%, rgba(237, 106, 90, 0) 76%); pointer-events: none;"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(10, 8, 7, 0.82) 0%, rgba(10, 8, 7, 0.34) 28%, rgba(10, 8, 7, 0) 54%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; gap: 4px; padding: 26px 24px 0 24px;">
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #ED6A5A;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
    <div style="flex-grow: 1; height: 2px; border-radius: 999px; background: #332A27;"></div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 20px; padding: 34px 24px 0 24px;">
    <div style="display: flex;">
      <div style="font-size: 12px; color: #8B837D; border: 1px solid #332A27; border-radius: 999px; padding: 6px 12px;">You guessed: about a metre</div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 88px; line-height: 0.86; color: #ED6A5A; font-feature-settings: 'tnum';">2.8</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; color: #A8918A;">km</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 17px; color: #A8918A;">A 35-minute walk.</div>
      <div style="font-size: 17px; font-weight: 500; color: #F5F1EE;">With your thumb.</div>
    </div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 18px; padding: 36px 24px 0 24px;">
    <div style="display: flex; flex-direction: column;">

      <div style="display: flex; align-items: flex-end; gap: 28px; height: 236px; border-bottom: 1px solid rgba(237, 106, 90, 0.22);">
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; color: #7A6F69;">About 1 m</div>
          <div style="width: 68%; height: 2px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, rgba(86, 74, 69, 0) 0%, #564A45 100%);"></div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #FF8878;">2.8 km</div>
          <div style="width: 68%; height: 182px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #DE5C4A 0%, #F5806E 100%);"></div>
        </div>
      </div>

      <div style="display: flex; gap: 28px; padding-top: 12px;">
        <div style="flex-grow: 1; text-align: center; font-size: 10.5px; font-weight: 500; letter-spacing: 0.16em; color: #7A6F69;">YOUR GUESS</div>
        <div style="flex-grow: 1; text-align: center; font-size: 10.5px; font-weight: 500; letter-spacing: 0.16em; color: #FF8878;">A TYPICAL DAY</div>
      </div>

    </div>

    <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 21px; line-height: 1.3; color: #B79E96; text-wrap: pretty;">About 2,800 times further than you guessed.</div>
  </div>

  <div style="position: relative; margin-top: auto; padding: 0 24px 34px 24px;">
    <div style="background: #ED6A5A; color: #2A0F09; border-radius: 999px; padding: 17px; text-align: center; font-size: 15.5px; font-weight: 500;">Continue</div>
  </div>

</div>
</x-dc>
</body>
</html>
