<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #121110; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 30px 20px 0 20px;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: #857E78;">SCROLLA</div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 46px 20px 0 20px;">
    <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">TODAY · SAT 23 AUG</div>
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 108px; line-height: 0.84; color: #ED6A5A; font-feature-settings: 'tnum';">2.3</span>
      <span style="font-size: 21px; font-weight: 400; color: #A39D98;">km</span>
    </div>
    <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 23px; line-height: 1.32; color: #A39D98; max-width: 290px; text-wrap: pretty;">about the height of three Burj Khalifas</div>
    <div style="display: flex;">
      <div style="display: flex; align-items: center; gap: 7px; background: rgba(63, 190, 156, 0.10); border: 1px solid rgba(63, 190, 156, 0.24); color: #3FBE9C; padding: 7px 13px 7px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3FBE9C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14"></path>
          <path d="M19 12l-7 7-7-7"></path>
        </svg>
        <span>0.5 km less than yesterday</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 44px 20px 0 20px;">

    <div style="background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">STANDING</div>
        <div style="display: flex; align-items: baseline; gap: 7px;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1; color: #F5F1EE;">2nd</span>
          <span style="font-size: 14px; color: #A39D98;">of 5</span>
        </div>
        <div style="font-size: 12.5px; color: #857E78;">College Friends · tap to compare</div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 5px; height: 44px;">
        <div style="width: 7px; height: 18px; border-radius: 4px; background: #2E2A28;"></div>
        <div style="width: 7px; height: 30px; border-radius: 4px; background: #F5F1EE;"></div>
        <div style="width: 7px; height: 36px; border-radius: 4px; background: #2E2A28;"></div>
        <div style="width: 7px; height: 40px; border-radius: 4px; background: #2E2A28;"></div>
        <div style="width: 7px; height: 44px; border-radius: 4px; background: #2E2A28;"></div>
      </div>
    </div>

    <div style="background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 18px 20px 20px 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
        </svg>
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">PEAK SCROLL TIME</div>
      </div>
      <div style="font-size: 15.5px; line-height: 1.55; color: #F5F1EE; text-wrap: pretty;">Most of it happens between 10 and 11pm. A commute's worth of distance, at bedtime.</div>
    </div>

  </div>

  <div style="margin-top: auto; display: flex; align-items: stretch; border-top: 1px solid #221F1D; background: #121110; padding: 10px 8px 22px 8px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ED6A5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5.5 9.5V20h13V9.5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #ED6A5A;">Today</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 20V12"></path>
        <path d="M12 20V5"></path>
        <path d="M19 20v-5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">Group</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 16l5-6 4 4 5-7 4 5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">Insights</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.7"></circle>
        <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">You</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
