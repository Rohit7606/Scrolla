<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #121110; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 32px 20px 0 20px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 52px; height: 52px; border-radius: 999px; background: #221F1D; border: 1px solid #332E2B; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; color: #F5F1EE;">R</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1.1; color: #F5F1EE;">Rohit</div>
        <div style="font-size: 12.5px; color: #857E78;">Tracking since 6 July</div>
      </div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 44px 20px 0 20px;">
    <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">YOUR RECORDS</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 18px 18px 20px 18px; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; color: #857E78;">LOWEST DAY</div>
        <div style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 38px; line-height: 1; color: #F5F1EE; font-feature-settings: 'tnum';">0.4</span>
          <span style="font-size: 13px; color: #857E78;">km</span>
        </div>
        <div style="font-size: 12.5px; color: #857E78;">12 July</div>
      </div>

      <div style="background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 18px 18px 20px 18px; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; color: #857E78;">7-DAY AVERAGE</div>
        <div style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 38px; line-height: 1; color: #F5F1EE; font-feature-settings: 'tnum';">3.1</span>
          <span style="font-size: 13px; color: #857E78;">km</span>
        </div>
        <div style="font-size: 12.5px; color: #3FBE9C;">down from 3.6</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 28px 20px 0 20px;">

    <div style="background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">HALL OF FAME</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5l7 7-7 7"></path>
        </svg>
      </div>
      <div style="font-size: 15.5px; line-height: 1.5; color: #F5F1EE; text-wrap: pretty;">You are 1.9 km from the group's best day.</div>
      <div style="height: 4px; border-radius: 999px; background: #221F1D;">
        <div style="width: 17%; height: 4px; border-radius: 999px; background: #6E6863;"></div>
      </div>
    </div>

    <div style="background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">GROUPS</div>
        <div style="font-size: 15.5px; color: #F5F1EE;">2 groups · College Friends on widget</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5l7 7-7 7"></path>
      </svg>
    </div>

  </div>

  <div style="margin-top: auto; display: flex; align-items: stretch; border-top: 1px solid #221F1D; background: #121110; padding: 10px 8px 22px 8px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5.5 9.5V20h13V9.5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">Today</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 20V12"></path>
        <path d="M12 20V5"></path>
        <path d="M19 20v-5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">Group</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 16l5-6 4 4 5-7 4 5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">Insights</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ED6A5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.7"></circle>
        <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #ED6A5A;">You</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
