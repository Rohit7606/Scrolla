<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #121110; }
    a { color: #ED6A5A; }
    a:hover { color: #F08475; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #121110; color: #F5F1EE; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 30px 20px 0 20px;">
    <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">GROUP · SAT 23 AUG</div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1.1; color: #F5F1EE;">College Friends</div>
  </div>

  <div style="display: flex; align-items: stretch; margin: 28px 20px 0 20px; background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 16px 4px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="font-size: 10px; font-weight: 500; letter-spacing: 0.16em; color: #857E78;">TODAY</div>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1; color: #F5F1EE; font-feature-settings: 'tnum';">2.3</div>
    </div>
    <div style="width: 1px; background: #2A2624;"></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="font-size: 10px; font-weight: 500; letter-spacing: 0.16em; color: #857E78;">YESTERDAY</div>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1; color: #A39D98; font-feature-settings: 'tnum';">2.8</div>
    </div>
    <div style="width: 1px; background: #2A2624;"></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="font-size: 10px; font-weight: 500; letter-spacing: 0.16em; color: #857E78;">7-DAY AVG</div>
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1; color: #A39D98; font-feature-settings: 'tnum';">3.1</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px; padding: 30px 20px 0 20px;">

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 14px;">
      <div style="width: 18px; font-size: 13px; font-weight: 500; color: #857E78; font-feature-settings: 'tnum';">1</div>
      <div style="flex-grow: 1; font-size: 17px; color: #F5F1EE;">Lewis</div>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; color: #F5F1EE; font-feature-settings: 'tnum';">1.2</span>
        <span style="font-size: 12px; color: #857E78;">km</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 14px; background: #221E1D; border: 1px solid #3A2F2C;">
      <div style="width: 18px; font-size: 13px; font-weight: 700; color: #ED6A5A; font-feature-settings: 'tnum';">2</div>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 500; color: #F5F1EE;">You</div>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; color: #ED6A5A; font-feature-settings: 'tnum';">2.3</span>
        <span style="font-size: 12px; color: #A39D98;">km</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 14px;">
      <div style="width: 18px; font-size: 13px; font-weight: 500; color: #857E78; font-feature-settings: 'tnum';">3</div>
      <div style="flex-grow: 1; font-size: 17px; color: #F5F1EE;">Max</div>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; color: #F5F1EE; font-feature-settings: 'tnum';">3.1</span>
        <span style="font-size: 12px; color: #857E78;">km</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 14px;">
      <div style="width: 18px; font-size: 13px; font-weight: 500; color: #857E78; font-feature-settings: 'tnum';">4</div>
      <div style="flex-grow: 1; font-size: 17px; color: #F5F1EE;">Alex</div>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; color: #F5F1EE; font-feature-settings: 'tnum';">4.5</span>
        <span style="font-size: 12px; color: #857E78;">km</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 14px;">
      <div style="width: 18px; font-size: 13px; font-weight: 500; color: #857E78; font-feature-settings: 'tnum';">5</div>
      <div style="flex-grow: 1; font-size: 17px; color: #F5F1EE;">Stroll</div>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; color: #F5F1EE; font-feature-settings: 'tnum';">6.8</span>
        <span style="font-size: 12px; color: #857E78;">km</span>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 9px; padding: 22px 34px 0 34px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3FBE9C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 16l5-6 4 4 7-9"></path>
    </svg>
    <div style="font-size: 13px; color: #3FBE9C;">Lewis has improved most this week</div>
  </div>

  <div style="margin: 26px 20px 0 20px; background: #1A1817; border: 1px solid #2A2624; border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #857E78;">HALL OF FAME</div>
      <div style="font-size: 15px; color: #F5F1EE;">Group's best day: 0.4 km by Lewis</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5l7 7-7 7"></path>
    </svg>
  </div>

  <div style="margin-top: auto; display: flex; align-items: stretch; border-top: 1px solid #221F1D; background: #121110; padding: 10px 8px 22px 8px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5.5 9.5V20h13V9.5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">Today</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ED6A5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 20V12"></path>
        <path d="M12 20V5"></path>
        <path d="M19 20v-5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #ED6A5A;">Group</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 16l5-6 4 4 5-7 4 5"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">Insights</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#857E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.7"></circle>
        <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path>
      </svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #857E78;">You</span>
    </div>
  </div>

</div>
</x-dc>

</html>
